version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: livocall-mongo
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["livocall-mongo:/data/db"]

  redis:
    image: redis:7-alpine
    container_name: livocall-redis
    restart: unless-stopped
    ports: ["6379:6379"]

  voice:
    build:
      context: ../../services/voice
    container_name: livocall-voice
    depends_on: [mongo, redis]
    environment:
      - MONGODB_URI=mongodb://mongo:27017/livocall
      - REDIS_URL=redis://redis:6379/0
      - TELEPHONY_EDGE=pjsip
      - PJSIP_LOCAL_SIP_PORT=5070
      - PJSIP_RTP_PORT_START=20000
      - PJSIP_RTP_PORT_RANGE=10000
      - PJSIP_LOAD_ACCOUNTS_FROM_DB=true
    ports:
      - "8084:8084"
      - "5070:5070/udp"
      - "20000-30000:20000-30000/udp"

  web:
    build:
      context: ../../apps/web
    container_name: livocall-web
    depends_on: [mongo]
    environment:
      - MONGODB_URI=mongodb://mongo:27017/livocall
      - SESSION_SECRET=local-dev-please-change-this-32-chars
      - VOICE_SERVICE_URL=http://voice:8084
      - VOICE_WS_PUBLIC_URL=ws://localhost:8084/ws/audio
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    ports: ["3000:3000"]

volumes:
  livocall-mongo:
