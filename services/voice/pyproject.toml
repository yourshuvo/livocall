[project]
name = "livocall-engine"
version = "0.1.0"
description = "AI voice engine for livocall. FastAPI + Pipecat + ESL bridge."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "websockets>=13.1",
    "redis>=5.1.0",
    "motor>=3.6.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
voice = [
    "pipecat-ai[google,deepgram,cartesia,silero]>=0.0.50",
    "numpy>=1.26.0",
]
storage = [
    "boto3>=1.34.0",
]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
